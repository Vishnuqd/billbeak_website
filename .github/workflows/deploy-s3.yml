name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Sync marketing site to S3
        # Publish only the marketing site (HTML + assets). The Let's Talk app
        # (apps/) and backend (services/) deploy separately (Cloudflare Pages +
        # Render) and must NOT be uploaded to the public bucket.
        run: |
          aws s3 sync . s3://billbeak.com \
            --region eu-north-1 \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".vscode/*" \
            --exclude ".DS_Store" \
            --exclude "*.md" \
            --exclude "Dockerfile" \
            --exclude ".dockerignore" \
            --exclude "apps/*" \
            --exclude "services/*" \
            --exclude "packages/*" \
            --exclude "config/*" \
            --exclude "node_modules/*" \
            --exclude "*/node_modules/*" \
            --exclude "*/.venv/*" \
            --exclude "*.sqlite3"

          aws s3 cp index.html s3://billbeak.com/index.html \
            --region eu-north-1 \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"
