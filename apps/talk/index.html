<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <title>Billbeak</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Set the theme before first paint to avoid a flash. Default is the black
      // (dark) theme; a warm light variant is available via the theme toggle.
      (function () {
        try {
          var stored = localStorage.getItem("billbeak:talk:theme");
          document.documentElement.setAttribute("data-theme", stored || "dark");
        } catch (e) {
          /* keep the default dark theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
